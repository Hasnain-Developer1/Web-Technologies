<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>

<script>
    let num1 = parseFloat(prompt("Enter the First number:"));
    let num2 = parseFloat(prompt("Enter the second number"))
    let operator = prompt("Enter the Operator (+, -, *, /):");

    let result;

    if (operator === "+") {
        result = num1 + num2;
    } 
    else if (operator === "-") {
        result = num1 - num2;
    } 
    else if (operator === "*") {
        result = num1 * num2;
    } 
    else if (operator === "/") {
        result = num1 / num2;
    } 
    else {
        alert("Invalid Operator!");
    }

    if (result !== undefined) {
        alert("Result: " + result);
    }
</script>

</body>
</html>
